<div class="container">

    <h2>Update User</h2>

    <form [formGroup]="userForm"
          (ngSubmit)="onUpdate()">

        <label>User ID</label>

        <input
            type="number"
            formControlName="id">

        <label>Name</label>

        <input
            type="text"
            formControlName="name">

        <label>Email</label>

        <input
            type="email"
            formControlName="email">

        <button type="submit">
            Update User
        </button>

    </form>

</div>

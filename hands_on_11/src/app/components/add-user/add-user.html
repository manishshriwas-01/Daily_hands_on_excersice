<div class="container">

    <h2>Add User</h2>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

        <label>Name</label>

        <input
            type="text"
            formControlName="name"
            placeholder="Enter Name">

        @if(userForm.controls.name.touched &&
        userForm.controls.name.invalid){

        <small>Name is required</small>

        }

        <label>Email</label>

        <input
            type="email"
            formControlName="email"
            placeholder="Enter Email">

        @if(userForm.controls.email.touched &&
        userForm.controls.email.invalid){

        <small>Enter valid email</small>

        }

        <button type="submit">
            Add User
        </button>

    </form>

</div>

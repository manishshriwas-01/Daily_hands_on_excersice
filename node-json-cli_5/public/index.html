<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>TaskFlow Dashboard</h1>

    <div class="stats">
        <div class="box">
            <h2 id="total">0</h2>
            <p>Total Tasks</p>
        </div>

        <div class="box">
            <h2 id="completed">0</h2>
            <p>Completed</p>
        </div>

        <div class="box">
            <h2 id="pending">0</h2>
            <p>Pending</p>
        </div>
    </div>

    <div id="taskContainer" class="tasks"></div>

</div>

<script src="app.js"></script>

</body>
</html>

<div class="container">

  <h2>Task List</h2>

  @for(task of Tasks(); track task.id){

    <div class="card">

      <h3>{{ task.title }}</h3>

      <p>
        Status:
        <span [ngClass]="task.completed ? 'completed' : 'pending'">
          {{ task.completed ? 'Completed' : 'Pending' }}
        </span>
      </p>

      <a [routerLink]="['/tasks', task.id]">
        View Details
      </a>

    </div>

  }

</div>
